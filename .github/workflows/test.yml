name: Teaching lab
on: [push, pull_request]
jobs:
  models:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m unittest discover -s tests -v
  jazzy:
    runs-on: ubuntu-24.04
    container: ros:jazzy-ros-base
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Build and probe live ROS interfaces
        run: |
          source /opt/ros/jazzy/setup.bash
          colcon build --packages-select rm_tuning_lab
          source install/setup.bash
          python3 tests/ros/live.py
      - name: Launch both rqt windows in a virtual display and verify subscriptions
        run: |
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends ros-jazzy-rqt-plot ros-jazzy-rqt-reconfigure python3-matplotlib xvfb xauth xdotool
          source /opt/ros/jazzy/setup.bash
          source install/setup.bash
          xvfb-run -a bash tests/ros/gui.sh
